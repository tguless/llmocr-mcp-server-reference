version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: mcp-invoice-postgres
    environment:
      POSTGRES_DB: llm_ocr_db
      POSTGRES_USER: liquibase_user
      POSTGRES_PASSWORD: liquibase_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mcp-invoice-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: mcp-invoice-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mcp-invoice-network

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: mcp-invoice-mc
    depends_on:
      - minio
    volumes:
      - ./docker/minio/init.sh:/init.sh
    entrypoint: /bin/sh /init.sh
    networks:
      - mcp-invoice-network

  # MCP Invoice Server (Spring Boot)
  mcp-invoice-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-invoice-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: llm_ocr_db
      DB_USERNAME: mcp_invoice_app
      DB_PASSWORD: mcp_invoice_app_password
      LIQUIBASE_USER: liquibase_user
      LIQUIBASE_PASSWORD: liquibase_password
      MCP_APP_DB_USERNAME: mcp_invoice_app
      MCP_APP_DB_PASSWORD: mcp_invoice_app_password
      JWT_SECRET: mcpInvoiceLocalDevSecretKey12345mcpInvoiceLocalDevSecretKey12345
      S3_PUBLIC_ENDPOINT: http://localhost:19000
      S3_DEFAULT_ENDPOINT: http://minio:9000
      S3_DEFAULT_ACCESS_KEY: minioadmin
      S3_DEFAULT_SECRET_KEY: minioadmin
      APP_BASE_URL: http://localhost:13002
      CORS_ORIGINS: http://localhost:13002,http://localhost:3000
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      # SSO: same client ID + secret as PaperIQ Global Admin → Platform MCP SSO (Invoice + Resume share one pair)
      # See README "PaperIQ hub: platform MCP SSO"
      ADMIN_SSO_TOKEN_ENDPOINT: ${ADMIN_SSO_TOKEN_ENDPOINT:-}
      ADMIN_SSO_CLIENT_ID: ${ADMIN_SSO_CLIENT_ID:-}
      ADMIN_SSO_CLIENT_SECRET: ${ADMIN_SSO_CLIENT_SECRET:-}
    ports:
      - "18081:8081"
    depends_on:
      - postgres
      - minio-init
    networks:
      - mcp-invoice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/mcp-invoice/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MCP Invoice Admin UI (React + nginx)
  mcp-invoice-admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    container_name: mcp-invoice-admin-ui
    ports:
      - "13002:80"
    depends_on:
      - mcp-invoice-server
    networks:
      - mcp-invoice-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  minio_data:

networks:
  mcp-invoice-network:
    driver: bridge
